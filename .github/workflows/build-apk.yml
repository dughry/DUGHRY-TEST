name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create WebView Android Project and Build APK
        run: |
          mkdir -p app/src/main/java/com/dughry/app app/src/main/res/layout app/src/main/res/values
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.dughry.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.dughry.app'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Dughry App</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF
          cat << 'EOF' > app/src/main/java/com/dughry/app/MainActivity.java
          package com.dughry.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  WebView webView = findViewById(R.id.webview);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://dughry.github.io/DUGHRY-TEST/dughry_original.html");
              }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
          </manifest>
          EOF
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dughry-apk
          path: app/build/outputs/apk/debug/app-debug.apk
